[package]
name = "katok"
version = "0.1.0"
edition = "2021"
rust-version = "1.91"
license = "MIT"
description = "Local KakaoTalk keyword, BM25, and vector search CLI — macOS app DB + Windows exported .txt + Windows UI send"
readme = "README.md"
repository = "https://github.com/Hostingglobal-Tech/katok-windows"
keywords = ["kakao", "kakaotalk", "search", "cli"]
categories = ["command-line-utilities"]
exclude = [
    ".fastembed_cache/**",
    ".gjc/**",
    ".omo/**",
    "crates/**",
    "target/**",
]

[[bin]]
name = "katok"
path = "src/main.rs"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
dirs = "6"
fastembed = { version = "5.16.1", default-features = false, features = ["hf-hub-native-tls", "ort-download-binaries-native-tls"] }
hmac = "0.12"
pbkdf2 = { version = "0.12", default-features = false }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread"] }
toml = "0.8"

# macOS/Linux read the KakaoTalk macOS app DB, which is SQLCipher-encrypted, so
# they use the SQLCipher build of rusqlite (vendored OpenSSL). On Windows the
# data source is exported .txt and the katok archive/index is a plain SQLite DB,
# so plain bundled SQLite is enough — this also avoids the OpenSSL-from-source
# build that requires perl on Windows.
[target.'cfg(not(target_os = "windows"))'.dependencies]
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }

[features]
default = ["windows-send"]
# Drive official KakaoTalk.exe via Windows UI Automation / SendInput.
# Never enables an unofficial Kakao protocol client.
windows-send = []

[target.'cfg(target_os = "windows")'.dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
